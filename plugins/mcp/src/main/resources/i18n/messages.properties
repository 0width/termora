termora.settings.mcp.guard.hint=<html>One rule per line. A command containing the rule text is blocked (case-insensitive). Lines starting with <b>#</b> are comments. Prefix with <b>regex:</b> to use a regular expression. Changes are saved and take effect immediately.</html>
